<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100xDevs - Final Fix</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="main-container">
        <nav class="navbar">
            <div class="left">
                <div class="logo">100<span>x</span>Devs</div>

            <div class="right">

                <div class="circle">H</div>

        <section class="hero-section">

                <div class="hero-btns">
                    <button class="btn-white">Learn more</button>

                </div>
            </div>

            <div class="hero-right">
                <div class="image-wrapper">
                    <div class="rotated-bg"></div>
                    <img src="hero-img.webp" class="hero-img" alt="Harkirat">
